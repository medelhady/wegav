<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة الرد الصوتي</title>
<style>
body{font-family:system-ui,sans-serif;background:#f4f6fa;margin:0;padding:24px;color:#222}
.card{background:#fff;max-width:560px;margin:auto;padding:24px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
h1{font-size:20px;margin-top:0}
label.lbl{display:block;margin:14px 0 6px;font-weight:600}
input[type=text]{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}
.hint{font-size:13px;color:#666;margin-top:6px}
.uploads{display:grid;gap:12px;margin-top:18px}
.up{padding:12px;border:1px solid #e3e6ee;border-radius:10px}
.up-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.up-head span.t{font-weight:700}
.up input[type=file]{display:none}
.up label.btn{margin:0;padding:10px 16px;background:#1a73e8;color:#fff;border-radius:8px;cursor:pointer;font-weight:600;white-space:nowrap}
.count{font-size:13px;color:#188038;margin-top:8px}
#log{margin-top:18px;font-size:14px;line-height:1.8;max-height:300px;overflow:auto;border-top:1px solid #eee;padding-top:12px;word-break:break-word}
.ok{color:#188038}.err{color:#d93025}.busy{color:#555}
</style>
</head>
<body>
<div class="card">
  <h1>لوحة الرد الصوتي</h1>

  <label class="lbl" for="name">اسم المتجر</label>
  <input type="text" id="name" placeholder="مثال: متجر النور">
  <div class="hint">اكتب اسم المتجر أولاً، ثم اختر الملفات. يمكنك اختيار أكثر من ملف في كل نوع.</div>

  <div class="uploads">
    <div class="up">
      <div class="up-head">
        <span class="t">🎤 صوت</span>
        <label class="btn" for="file-audio">اختر أصواتاً</label>
        <input type="file" id="file-audio" accept="audio/*" multiple>
      </div>
      <div class="count" id="count-audio">تم رفع 0 ملف</div>
    </div>

    <div class="up">
      <div class="up-head">
        <span class="t">🖼️ صورة</span>
        <label class="btn" for="file-image">اختر صوراً</label>
        <input type="file" id="file-image" accept="image/*" multiple>
      </div>
      <div class="count" id="count-image">تم رفع 0 ملف</div>
    </div>

    <div class="up">
      <div class="up-head">
        <span class="t">🎬 فيديو</span>
        <label class="btn" for="file-video">اختر فيديوهات</label>
        <input type="file" id="file-video" accept="video/*" multiple>
      </div>
      <div class="count" id="count-video">تم رفع 0 ملف</div>
    </div>
  </div>

  <div id="log"></div>
</div>

<script>
const LIMIT = 4 * 1024 * 1024;
const log = document.getElementById('log');
const counts = { audio: 0, image: 0, video: 0 };

function addLine(text, cls) {
  const d = document.createElement('div');
  d.className = cls || '';
  d.textContent = text;
  log.prepend(d);
  return d;
}

async function upload(file, kind, storeName) {
  const ext = (file.name.split('.').pop() || 'bin').toLowerCase();
  let res;
  try {
    res = await fetch('/api/upload', {
      method: 'POST',
      headers: {
        'Content-Type': file.type || 'application/octet-stream',
        'X-Store-Name': encodeURIComponent(storeName),
        'X-Media-Kind': kind,
        'X-File-Ext': ext
      },
      body: file
    });
  } catch (e) {
    throw new Error('تعذر الاتصال بالسيرفر: ' + e.message);
  }

  if (res.status === 404) {
    throw new Error('الدالة /api/upload غير موجودة');
  }

  const text = await res.text();
  let data = {};
  try { data = JSON.parse(text); } catch { data = { raw: text.slice(0, 300) }; }

  if (!res.ok) {
    const detail = [
      data.error,
      data.step,
      data.status,
      data.message,
      data.details ? JSON.stringify(data.details).slice(0, 300) : '',
      data.raw
    ].filter(Boolean).join(' | ') || ('HTTP ' + res.status);
    throw new Error(detail);
  }
  return data;
}

['audio', 'image', 'video'].forEach(kind => {
  const input = document.getElementById('file-' + kind);
  const countEl = document.getElementById('count-' + kind);

  input.addEventListener('change', async () => {
    const files = Array.from(input.files);
    input.value = '';
    if (files.length === 0) return;

    const storeName = document.getElementById('name').value.trim();
    if (!storeName) {
      addLine('✗ اكتب اسم المتجر أولاً ثم أعد اختيار الملفات', 'err');
      return;
    }

    for (const file of files) {
      if (file.size > LIMIT) {
        addLine('✗ ' + file.name + ': الحجم أكبر من 4 ميغابايت', 'err');
        continue;
      }

      const line = addLine('… جاري رفع ' + file.name, 'busy');
      try {
        const data = await upload(file, kind, storeName);
        counts[kind]++;
        countEl.textContent = 'تم رفع ' + counts[kind] + ' ملف';
        line.className = 'ok';
        line.textContent = '✓ ' + file.name + ' → ' + data.path;
      } catch (e) {
        line.className = 'err';
        line.textContent = '✗ ' + file.name + ': ' + e.message;
      }
    }
  });
});
</script>
</body>
</html>
