<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة الرد الصوتي</title>
<style>
body{font-family:system-ui,sans-serif;background:#f4f6fa;margin:0;padding:24px;color:#222}
.card{background:#fff;max-width:520px;margin:auto;padding:24px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
h1{font-size:20px;margin-top:0}
label{display:block;margin:14px 0 6px;font-weight:600}
input[type=text]{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}
input[type=file]{width:100%}
button{margin-top:18px;width:100%;padding:12px;background:#1a73e8;color:#fff;border:0;border-radius:8px;font-size:16px;cursor:pointer}
button:disabled{background:#9bbcf0;cursor:wait}
#msg{margin-top:14px;font-size:14px;line-height:1.7}
.ok{color:#188038}.err{color:#d93025}
.hint{font-size:13px;color:#666;margin-top:6px}
</style>
</head>
<body>
<div class="card">
  <h1>لوحة الرد الصوتي</h1>

  <label for="name">اسم المتجر</label>
  <input type="text" id="name" placeholder="مثال: متجر النور">

  <label for="file">اختر الملف (صوت أو صورة أو فيديو)</label>
  <input type="file" id="file" accept="audio/*,image/*,video/*">
  <div class="hint">الحد الأقصى 4 ميغابايت لكل ملف</div>

  <button id="btn">رفع الملف</button>
  <div id="msg"></div>
</div>

<script>
const LIMIT = 4 * 1024 * 1024;
const EXT_KIND = {
  ogg:'audio', mp3:'audio', m4a:'audio', wav:'audio', opus:'audio', aac:'audio', amr:'audio',
  jpg:'image', jpeg:'image', png:'image', webp:'image', gif:'image',
  mp4:'video', mov:'video', webm:'video', '3gp':'video'
};

function detectKind(file) {
  const byMime = (file.type || '').split('/')[0];
  if (['audio','image','video'].includes(byMime)) return byMime;
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  return EXT_KIND[ext] || null;
}

const msg = document.getElementById('msg');
const btn = document.getElementById('btn');

btn.addEventListener('click', async () => {
  const name = document.getElementById('name').value.trim();
  const file = document.getElementById('file').files[0];
  msg.className = '';

  if (!name) { msg.className = 'err'; msg.textContent = 'اكتب اسم المتجر أولاً'; return; }
  if (!file) { msg.className = 'err'; msg.textContent = 'اختر ملفاً أولاً'; return; }

  const kind = detectKind(file);
  if (!kind) { msg.className = 'err'; msg.textContent = 'نوع الملف غير مدعوم'; return; }
  if (file.size > LIMIT) { msg.className = 'err'; msg.textContent = 'الملف كبير جداً (الحد 4 ميغابايت)'; return; }

  const ext = (file.name.split('.').pop() || 'bin').toLowerCase();
  const mime = file.type || 'application/octet-stream';

  btn.disabled = true;
  msg.textContent = 'جاري الرفع...';

  try {
    const res = await fetch('/api/upload', {
      method: 'POST',
      headers: {
        'Content-Type': mime,
        'X-Store-Name': encodeURIComponent(name),
        'X-Media-Kind': kind,
        'X-File-Ext': ext
      },
      body: file
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      msg.className = 'err';
      msg.textContent = 'فشل الرفع: ' + (data.error || res.status);
      return;
    }
    msg.className = 'ok';
    msg.textContent = 'تم الرفع بنجاح ✓ (' + kind + ') المسار: ' + data.path;
  } catch (e) {
    msg.className = 'err';
    msg.textContent = 'تعذر الاتصال بالسيرفر';
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
