<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة الرد الصوتي</title>
<style>
body{font-family:system-ui,sans-serif;background:#f4f6fa;margin:0;padding:24px;color:#222}
.card{background:#fff;max-width:520px;margin:auto;padding:24px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
h1{font-size:20px;margin-top:0}
label{display:block;margin:14px 0 6px;font-weight:600}
input[type=text]{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}
input[type=file]{width:100%}
button{margin-top:18px;width:100%;padding:12px;background:#1a73e8;color:#fff;border:0;border-radius:8px;font-size:16px;cursor:pointer}
#msg{margin-top:14px;font-size:14px}
.ok{color:#188038}.err{color:#d93025}
</style>
</head>
<body>
<div class="card">
  <h1>لوحة الرد الصوتي</h1>
  <label for="name">اسم المتجر</label>
  <input type="text" id="name" placeholder="مثال: متجر النور">
  <label for="file">اختر الملف (صوت أو صورة أو فيديو)</label>
  <input type="file" id="file" accept="audio/*,image/*,video/*">
  <button id="btn">تحقق من الملف</button>
  <div id="msg"></div>
</div>
<script>
const LIMITS = { audio: 16*1024*1024, image: 5*1024*1024, video: 16*1024*1024 };
document.getElementById('btn').addEventListener('click', () => {
  const name = document.getElementById('name').value.trim();
  const file = document.getElementById('file').files[0];
  const msg = document.getElementById('msg');
  msg.className = '';
  if (!name) { msg.className = 'err'; msg.textContent = 'اكتب اسم المتجر أولاً'; return; }
  if (!file) { msg.className = 'err'; msg.textContent = 'اختر ملفاً أولاً'; return; }
  const type = file.type.split('/')[0];
  if (!LIMITS[type]) { msg.className = 'err'; msg.textContent = 'نوع الملف غير مدعوم'; return; }
  if (file.size > LIMITS[type]) { msg.className = 'err'; msg.textContent = 'الملف كبير جداً'; return; }
  msg.className = 'ok';
  msg.textContent = 'الملف صالح: ' + file.name + ' (' + type + ')، وسيُحفظ في الخطوة القادمة.';
});
</script>
</body>
</html>
