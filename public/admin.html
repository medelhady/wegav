<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة الإدارة</title>
<style>
body{font-family:system-ui,sans-serif;background:#f4f6fa;margin:0;color:#222}
.wrap{max-width:720px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:12px}
h1{font-size:18px;margin:0 0 4px}
h2{font-size:16px;margin:0 0 10px}
.sub{font-size:13px;color:#666}
input[type=password],input[type=text],input[type=number],select{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box;font-size:15px;background:#fff}
.btn{background:#1a73e8;color:#fff;border:0;border-radius:8px;padding:8px 12px;cursor:pointer;font-size:13px;font-weight:600;margin:2px;text-decoration:none;display:inline-block}
.btn.gray{background:#fff;color:#333;border:1px solid #ccc}
.btn.red{background:#fff;color:#d93025;border:1px solid #f1b3ad}
.btn.green{background:#188038}
.btn.danger{background:#d93025}
.btn:disabled{opacity:.5;cursor:wait}
.store{border-bottom:1px dashed #eee;padding:12px 0}
.store:last-child{border-bottom:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.name{font-weight:700;font-size:15px}
.meta{font-size:13px;color:#555;margin-top:4px;line-height:1.7;white-space:pre-line}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:700}
.b-active{background:#e6f4ea;color:#188038}
.b-paused{background:#fef7e0;color:#b06000}
.b-suspended{background:#fce8e6;color:#d93025}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.stat{flex:1;min-width:120px;background:#fff;border-radius:10px;padding:12px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.stat .k{font-size:12px;color:#777}
.stat .v{font-size:20px;font-weight:700;margin-top:4px}
.danger-box{background:#fff5f5;border:1px solid #f1b3ad;border-radius:8px;padding:10px;margin-top:8px}
.danger-box .hint{font-size:12px;color:#a50e0e;margin-bottom:6px}
.box{background:#f7f9fc;border:1px solid #dde4ee;border-radius:8px;padding:10px;margin-top:8px}
.box .hint{font-size:12px;color:#555;margin-bottom:6px}
.box-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.box-row input{width:130px}
.box-row .total{font-weight:700;color:#188038;font-size:14px}
.codes-row{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px dashed #eee;padding:8px 0;flex-wrap:wrap}
.codes-row .code{font-weight:700;font-size:15px;direction:ltr}
.codes-row .info{font-size:12px;color:#555}
.mode-box{background:#f7f9fc;border:1px solid #dde4ee;border-radius:8px;padding:10px;margin-top:8px}
.mode-box .hint{font-size:12px;color:#555;margin:6px 0}
.mode-box .ok-line{font-size:13px;color:#188038;font-weight:700;margin-bottom:6px}
.num-row{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px dashed #eee;padding:10px 0;flex-wrap:wrap}
.num-row:last-child{border-bottom:0}
.num-info{font-size:13px;line-height:1.8}
.num-info b{font-size:14px}
.num-actions{display:flex;gap:4px;flex-wrap:wrap}
.ltr{direction:ltr;unicode-bidi:embed;display:inline-block}
#msg{font-size:13px;margin-top:8px;min-height:18px;white-space:pre-line}
.ok{color:#188038}.err{color:#d93025}
.hidden{display:none}
  .nlist{display:flex;flex-direction:column;gap:8px}
.nitem{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:#f9fbff;border:1px solid #e3e9f3;border-right:4px solid #188038;border-radius:10px;padding:12px}
.nitem.off{border-right-color:#d93025;background:#fff8f8}
.nhead{font-weight:700;font-size:15px;margin-bottom:8px}
.nchips{display:flex;gap:6px;flex-wrap:wrap}
.nchip{background:#fff;border:1px solid #dde4ee;border-radius:8px;padding:4px 8px;font-size:12px;color:#555}
.nchip b{color:#222;font-weight:700}
.nact{display:flex;gap:4px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="wrap">

  <div class="card" id="login-box">
    <h1>لوحة الإدارة</h1>
    <div class="sub" style="margin-bottom:12px">أدخل كلمة السر للمتابعة</div>
    <input type="password" id="pass" placeholder="كلمة السر">
    <div style="margin-top:12px;text-align:left">
      <button class="btn" id="btn-login">دخول</button>
    </div>
    <div id="login-msg" class="err" style="margin-top:8px;font-size:13px"></div>
  </div>

  <div id="app" class="hidden">
    <div class="card row">
      <div>
        <h1>لوحة الإدارة</h1>
        <div class="sub">إدارة التجار والاشتراكات</div>
      </div>
      <div>
        <a class="btn gray" href="/messages.html" style="text-decoration:none">رسائل البوت</a>
        <a class="btn gray" href="/guide.html" style="text-decoration:none">دليل الربط</a>
        <button class="btn gray" id="btn-refresh">تحديث</button>
        <button class="btn gray" id="btn-logout">خروج</button>
      </div>
    </div>

    <div class="stats">
      <div class="stat"><div class="k">إجمالي التجار</div><div class="v" id="s-total">0</div></div>
      <div class="stat"><div class="k">الفعّالون</div><div class="v" id="s-active">0</div></div>
      <div class="stat"><div class="k">على رقم خاص</div><div class="v" id="s-private-num">0</div></div>
      <div class="stat"><div class="k">الموقوفون</div><div class="v" id="s-susp">0</div></div>
    </div>

    <div class="card">
      <div class="row">
        <h2>قائمة الأرقام والبوتات</h2>
        <span class="sub">رقم التاجر ↔ رقم البوت</span>
      </div>
      <div id="numbers-list" style="margin-top:8px"></div>
    </div>

    <div class="card">
      <div class="row">
        <h2>الأكواد النشطة</h2>
        <button class="btn gray" id="btn-codes">عرض الأكواد</button>
      </div>
      <div id="codes-box" class="hidden" style="margin-top:8px"></div>
    </div>

    <div class="card">
      <div id="list"></div>
      <div id="msg"></div>
    </div>
  </div>

</div>

<script>
let password = sessionStorage.getItem('admin_pass') || '';
let stores = [];
const $ = id => document.getElementById(id);
const STATUS_LABEL = { active: 'فعّال', paused: 'متوقف مؤقتاً', suspended: 'موقوف' };

function show(text, cls) {
  const m = $('msg');
  m.className = cls || '';
  m.textContent = text;
}

async function api(method, body, query) {
  const res = await fetch('/api/admin' + (query || ''), {
    method,
    headers: { 'Content-Type': 'application/json', 'X-Admin-Password': password },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error(data.error || ('HTTP ' + res.status));
    err.status = res.status;
    throw err;
  }
  return data;
}

function fmtDate(iso) {
  if (!iso) return 'بدون تاريخ';
  return new Date(iso).toLocaleDateString('ar');
}

function hasPrivateNumber(s) {
  return Boolean(s.wa_phone_number_id);
}

function renderStats() {
  $('s-total').textContent = stores.length;
  $('s-active').textContent = stores.filter(s => s.status === 'active').length;
  $('s-private-num').textContent = stores.filter(hasPrivateNumber).length;
  $('s-susp').textContent = stores.filter(s => s.status === 'suspended').length;
}

// قائمة مختصرة: رقم التاجر ورقم البوت مع أزرار الإيقاف والتشغيل والفصل
function renderNumbers() {
  const box = $('numbers-list');
  box.innerHTML = '';
  if (stores.length === 0) {
    box.innerHTML = '<div class="sub">لا يوجد تجار بعد</div>';
    return;
  }

  stores.forEach(s => {
    const row = document.createElement('div');
    row.className = 'num-row';

    const info = document.createElement('div');
    info.className = 'num-info';

    const title = document.createElement('div');
    title.append(document.createElement('b'));
    title.firstChild.textContent = s.name + '  (كود ' + s.merchant_code + ')';
    const badge = document.createElement('span');
    badge.className = 'badge b-' + s.status;
    badge.textContent = ' ' + (STATUS_LABEL[s.status] || s.status);
    title.append(' ', badge);

    const merchantLine = document.createElement('div');
    merchantLine.textContent = 'رقم التاجر: ';
    const mNum = document.createElement('span');
    mNum.className = 'ltr';
    mNum.textContent = s.phone || '—';
    merchantLine.appendChild(mNum);

    const botLine = document.createElement('div');
    botLine.textContent = 'رقم البوت: ';
    const bNum = document.createElement('span');
    bNum.className = 'ltr';
    if (hasPrivateNumber(s)) {
      bNum.textContent = (s.wa_display_phone || s.wa_phone_number_id) + (s.wa_verified_name ? ' | ' + s.wa_verified_name : '');
    } else {
      bNum.textContent = 'بوت مشترك (بدون رقم خاص)';
    }
    botLine.appendChild(bNum);

    info.append(title, merchantLine, botLine);

    const actions = document.createElement('div');
    actions.className = 'num-actions';

    const addBtn = (label, cls, fn) => {
      const b = document.createElement('button');
      b.className = 'btn ' + (cls || '');
      b.textContent = label;
      b.addEventListener('click', () => fn(b));
      actions.appendChild(b);
    };

    if (s.status === 'active') {
      addBtn('إيقاف البوت', 'gray', b => act(s.id, 'pause', {}, b));
    } else {
      addBtn('تشغيل البوت', 'green', b => act(s.id, 'activate', {}, b));
    }

    if (hasPrivateNumber(s)) {
      addBtn('فصل الرقم', 'red', b => disconnectNumber(s, b));
    }

    row.append(info, actions);
    box.appendChild(row);
  });
}

function renderList() {
  const box = $('list');
  box.innerHTML = '';
  if (stores.length === 0) {
    box.innerHTML = '<div class="sub">لا يوجد تجار بعد</div>';
    return;
  }

  stores.forEach(s => {
    const row = document.createElement('div');
    row.className = 'store';

    const top = document.createElement('div');
    top.className = 'row';

    const info = document.createElement('div');
    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = s.name + '  (كود ' + s.merchant_code + ')';
    const badge = document.createElement('span');
    badge.className = 'badge b-' + s.status;
    badge.textContent = STATUS_LABEL[s.status] || s.status;
    name.append(' ', badge);
    info.appendChild(name);

    const quota = Number(s.notify_quota || 0);
    const unit = Number(s.notify_unit_price || 0);
    const used = Number(s.notify_used || 0);

    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent =
      'الهاتف: ' + (s.phone || '—') + '\n' +
      'نوع الاستقبال: ' + (hasPrivateNumber(s) ? 'رقم خاص' : 'بوت مشترك') + '\n' +
      'الخطة: ' + (s.plan === 'paid' ? 'مدفوعة' : 'تجريبية') + ' | ' +
      'الردود: ' + s.replies_used + ' من ' + s.replies_quota + ' | ' +
      'الانتهاء: ' + fmtDate(s.plan_expires_at) + '\n' +
      'المحتوى الخاص: ' + (s.private_enabled ? 'مفعّل ✅' : 'موقوف ⛔') + '\n' +
      'الأكواد العامة: ' + (s.public_codes_enabled ? 'مفعّلة ✅' : 'موقوفة ⛔') + '\n' +
      'الإشعارات: ' + used + ' من ' + quota + ' إشعار شهرياً (' + (quota * unit) + ' أوقية)';
    info.appendChild(meta);

    top.appendChild(info);
    row.appendChild(top);

    row.appendChild(buildModeBox(s));

    const box2 = document.createElement('div');
    box2.className = 'box';

    const hint = document.createElement('div');
    hint.className = 'hint';
    hint.textContent = 'حصة الإشعارات الشهرية: عدد الإشعارات × سعر الإشعار الواحد بالأوقية';

    const r2 = document.createElement('div');
    r2.className = 'box-row';

    const qInput = document.createElement('input');
    qInput.type = 'number';
    qInput.min = '0';
    qInput.step = '1';
    qInput.value = String(quota);
    qInput.placeholder = 'عدد الإشعارات';

    const uInput = document.createElement('input');
    uInput.type = 'number';
    uInput.min = '0';
    uInput.step = '1';
    uInput.value = String(unit);
    uInput.placeholder = 'سعر الإشعار';

    const totalEl = document.createElement('span');
    totalEl.className = 'total';
    const refreshTotal = () => {
      const q = Math.floor(Number(qInput.value) || 0);
      const u = Math.floor(Number(uInput.value) || 0);
      totalEl.textContent = 'الإجمالي: ' + (q * u) + ' أوقية';
    };
    qInput.addEventListener('input', refreshTotal);
    uInput.addEventListener('input', refreshTotal);
    refreshTotal();

    const saveBtn = document.createElement('button');
    saveBtn.className = 'btn green';
    saveBtn.textContent = 'حفظ الحصة';
    saveBtn.addEventListener('click', () => saveNotify(s, qInput, uInput, saveBtn));

    const resetBtn = document.createElement('button');
    resetBtn.className = 'btn gray';
    resetBtn.textContent = 'تصفير عداد الإشعارات';
    resetBtn.addEventListener('click', () => resetNotify(s, resetBtn));

    r2.append(qInput, uInput, totalEl, saveBtn, resetBtn);
    box2.append(hint, r2);
    row.appendChild(box2);

    const actions = document.createElement('div');
    actions.style.marginTop = '8px';

    const addBtn = (label, cls, fn) => {
      const b = document.createElement('button');
      b.className = 'btn ' + (cls || '');
      b.textContent = label;
      b.addEventListener('click', () => fn(b));
      actions.appendChild(b);
      return b;
    };

    addBtn('تفعيل', 'green', b => act(s.id, 'activate', {}, b));
    addBtn('إيقاف مؤقت', 'gray', b => act(s.id, 'pause', {}, b));
    addBtn('إيقاف كامل', 'red', b => act(s.id, 'suspend', {}, b));
    addBtn('اشتراك شهري (500 رد)', '', b => act(s.id, 'paid', { quota: 500, months: 1 }, b));
    addBtn('تصفير الردود', 'gray', b => act(s.id, 'reset', {}, b));

    if (s.private_enabled) {
      addBtn('إيقاف الخاص', 'gray', b => act(s.id, 'private_off', {}, b));
    } else {
      addBtn('تفعيل الخاص', 'green', b => act(s.id, 'private_on', {}, b));
    }

    if (s.public_codes_enabled) {
      addBtn('إيقاف الأكواد العامة', 'gray', b => act(s.id, 'public_off', {}, b));
    } else {
      addBtn('تفعيل الأكواد العامة', 'green', b => act(s.id, 'public_on', {}, b));
    }

    addBtn('حذف الحساب', 'danger', () => toggleDelete(row, s));

    row.appendChild(actions);
    box.appendChild(row);
  });
}

// صندوق نوع الاستقبال: بوت مشترك أو رقم خاص
function buildModeBox(s) {
  const box = document.createElement('div');
  box.className = 'mode-box';

  const title = document.createElement('div');
  title.className = 'hint';
  title.textContent = 'نوع الاستقبال';

  const sel = document.createElement('select');
  const optShared = document.createElement('option');
  optShared.value = 'shared';
  optShared.textContent = 'بوت مشترك (الزبون يراسل رقمنا بكود المتجر)';
  const optPrivate = document.createElement('option');
  optPrivate.value = 'private';
  optPrivate.textContent = 'رقم خاص (الرسائل تصل إلى رقم التاجر)';
  sel.append(optShared, optPrivate);
  sel.value = hasPrivateNumber(s) ? 'private' : 'shared';

  const detail = document.createElement('div');

  const renderDetail = () => {
    detail.innerHTML = '';
    if (sel.value === 'private') {
      if (hasPrivateNumber(s)) {
        const ok = document.createElement('div');
        ok.className = 'ok-line';
        ok.textContent = 'متصل ✅ ' + (s.wa_display_phone || '') + (s.wa_verified_name ? ' | ' + s.wa_verified_name : '');
        detail.appendChild(ok);
      }

      const hint = document.createElement('div');
      hint.className = 'hint';
      hint.textContent = hasPrivateNumber(s)
        ? 'لتغيير الرقم أدخل القيم الثلاث الجديدة ثم اضغط ربط.'
        : 'أدخل القيم الثلاث التي أرسلها التاجر (معرّف الرقم، ومعرّف حساب الواتساب، والتوكن)، ثم اضغط ربط وفحص.';

      const pid = document.createElement('input');
      pid.type = 'text';
      pid.placeholder = 'Phone Number ID (معرّف الرقم)';
      pid.style.marginBottom = '6px';

      const waba = document.createElement('input');
      waba.type = 'text';
      waba.placeholder = 'WABA ID (معرّف حساب واتساب للأعمال)';
      waba.style.marginBottom = '6px';

      const tok = document.createElement('input');
      tok.type = 'password';
      tok.placeholder = 'التوكن الدائم (Access Token)';
      tok.style.marginBottom = '6px';

      const connectBtn = document.createElement('button');
      connectBtn.className = 'btn green';
      connectBtn.textContent = 'ربط وفحص';
      connectBtn.addEventListener('click', () => connectNumber(s, pid, waba, tok, connectBtn));

      detail.append(hint, pid, waba, tok, connectBtn);
    } else {
      const hint = document.createElement('div');
      hint.className = 'hint';
      hint.textContent = 'الزبائن يراسلون رقم البوت المشترك ويدخلون كود المتجر. لا يحتاج التاجر إعداداً تقنياً.';
      detail.appendChild(hint);

      if (hasPrivateNumber(s)) {
        const disconnectBtn = document.createElement('button');
        disconnectBtn.className = 'btn red';
        disconnectBtn.textContent = 'تحويل إلى بوت مشترك (فصل الرقم الخاص)';
        disconnectBtn.addEventListener('click', () => disconnectNumber(s, disconnectBtn));
        detail.appendChild(disconnectBtn);
      }
    }
  };

  sel.addEventListener('change', renderDetail);

  renderDetail();
  box.append(title, sel, detail);
  return box;
}

async function connectNumber(s, pidInput, wabaInput, tokInput, btn) {
  const pid = pidInput.value.trim();
  const wabaId = wabaInput.value.trim();
  const token = tokInput.value.trim();
  if (!pid) return show('✗ أدخل معرّف الرقم (Phone Number ID)', 'err');
  if (!wabaId) return show('✗ أدخل معرّف حساب واتساب للأعمال (WABA ID)', 'err');
  if (!token) return show('✗ أدخل التوكن', 'err');
  if (!confirm('ربط رقم ' + s.name + '؟ سيُفحص الرقم ويُشترك الحساب في التطبيق.')) return;

  btn.disabled = true;
  btn.textContent = '… جاري الفحص والاشتراك';
  try {
    const data = await api('POST', {
      id: s.id,
      action: 'wa_connect',
      phone_number_id: pid,
      waba_id: wabaId,
      token,
    });
    show('✓ تم ربط الرقم ' + (data.display || '') + ' لـ ' + s.name, 'ok');
    tokInput.value = '';
    await load();
  } catch (e) {
    show('✗ فشل الربط: ' + e.message, 'err');
  } finally {
    btn.disabled = false;
    btn.textContent = 'ربط وفحص';
  }
}

async function disconnectNumber(s, btn) {
  if (!confirm('فصل الرقم الخاص لـ ' + s.name + '؟ سيتوقف البوت على هذا الرقم، وتبقى الردود والزبائن كما هي.')) return;
  btn.disabled = true;
  try {
    await api('POST', { id: s.id, action: 'wa_disconnect' });
    show('✓ تم فصل الرقم عن ' + s.name, 'ok');
    await load();
  } catch (e) {
    show('✗ فشل: ' + e.message, 'err');
    btn.disabled = false;
  }
}

async function renderCodes() {
  const box = $('codes-box');
  box.innerHTML = '';
  try {
    const data = await api('GET', null, '?codes=1');
    const items = Array.isArray(data.items) ? data.items : [];
    if (items.length === 0) {
      box.innerHTML = '<div class="sub">لا توجد أكواد نشطة</div>';
      return;
    }
    items.forEach(c => {
      const row = document.createElement('div');
      row.className = 'codes-row';

      const info = document.createElement('div');
      const code = document.createElement('div');
      code.className = 'code';
      code.textContent = c.code;
      const det = document.createElement('div');
      det.className = 'info';
      const storeName = c.stores && c.stores.name ? c.stores.name : '—';
      const kindLabel = c.kind === 'public' ? 'عام' : 'شخصي';
      const bound = c.kind === 'personal' ? (' | مرتبط برقم: ' + (c.bound_phone || 'لم يُستخدم بعد')) : '';
      det.textContent =
        storeName + ' | ' + kindLabel + ' | ' +
        (c.topic || 'كل المحتوى الخاص') +
        ' | ينتهي: ' + fmtDate(c.expires_at) + bound;
      info.append(code, det);

      const rv = document.createElement('button');
      rv.className = 'btn red';
      rv.textContent = 'إلغاء الكود';
      rv.addEventListener('click', async () => {
        if (!confirm('إلغاء الكود ' + c.code + ' نهائياً؟')) return;
        rv.disabled = true;
        try {
          await api('POST', { action: 'revoke_code', code_id: c.id });
          show('✓ تم إلغاء الكود ' + c.code, 'ok');
          await renderCodes();
        } catch (e) {
          show('✗ فشل الإلغاء: ' + e.message, 'err');
          rv.disabled = false;
        }
      });

      row.append(info, rv);
      box.appendChild(row);
    });
  } catch (e) {
    box.innerHTML = '<div class="err">✗ تعذر تحميل الأكواد: ' + e.message + '</div>';
  }
}

$('btn-codes').addEventListener('click', async () => {
  const box = $('codes-box');
  if (!box.classList.contains('hidden')) {
    box.classList.add('hidden');
    return;
  }
  box.classList.remove('hidden');
  await renderCodes();
});

async function saveNotify(s, qInput, uInput, btn) {
  const q = Number(qInput.value);
  const u = Number(uInput.value);
  if (!Number.isInteger(q) || q < 0) return show('✗ عدد الإشعارات يجب أن يكون رقماً صحيحاً', 'err');
  if (!Number.isInteger(u) || u < 0) return show('✗ سعر الإشعار يجب أن يكون رقماً صحيحاً', 'err');

  if (!confirm('تأكيد: ' + s.name + ' — ' + q + ' إشعار × ' + u + ' أوقية = ' + (q * u) + ' أوقية؟')) return;

  btn.disabled = true;
  try {
    await api('POST', { id: s.id, action: 'notify_set', quota: q, unit_price: u });
    show('✓ تم حفظ حصة الإشعارات لـ ' + s.name, 'ok');
    await load();
  } catch (e) {
    show('✗ فشل الحفظ: ' + e.message, 'err');
  } finally {
    btn.disabled = false;
  }
}

async function resetNotify(s, btn) {
  if (!confirm('تصفير عداد الإشعارات المستخدمة لـ ' + s.name + '؟')) return;
  btn.disabled = true;
  try {
    await api('POST', { id: s.id, action: 'notify_reset' });
    show('✓ تم تصفير عداد الإشعارات لـ ' + s.name, 'ok');
    await load();
  } catch (e) {
    show('✗ فشل: ' + e.message, 'err');
  } finally {
    btn.disabled = false;
  }
}

function toggleDelete(row, s) {
  const existing = row.querySelector('.danger-box');
  if (existing) { existing.remove(); return; }

  const box = document.createElement('div');
  box.className = 'danger-box';

  const hint = document.createElement('div');
  hint.className = 'hint';
  hint.textContent =
    'تحذير: سيُحذف كل شيء نهائياً (الردود، الملفات، النصوص، الجلسة). ' +
    'للتأكيد اكتب اسم المتجر بالضبط: ' + s.name;

  const input = document.createElement('input');
  input.type = 'text';
  input.placeholder = 'اكتب اسم المتجر';

  const confirmBtn = document.createElement('button');
  confirmBtn.className = 'btn danger';
  confirmBtn.textContent = 'حذف نهائياً';
  confirmBtn.style.marginTop = '8px';
  confirmBtn.addEventListener('click', async () => {
    if (input.value.trim() !== s.name) {
      return show('✗ الاسم غير مطابق، لم يُحذف شيء', 'err');
    }
    confirmBtn.disabled = true;
    try {
      await api('POST', { id: s.id, action: 'delete', confirm_name: input.value.trim() });
      show('🗑 تم حذف حساب ' + s.name + ' نهائياً', 'ok');
      await load();
    } catch (e) {
      show('✗ فشل الحذف: ' + e.message, 'err');
      confirmBtn.disabled = false;
    }
  });

  box.append(hint, input, confirmBtn);
  row.appendChild(box);
  input.focus();
}

async function act(id, action, extra, btn) {
  const store = stores.find(x => x.id === id);
  const label = store ? store.name : '';
  if (!confirm('تأكيد: ' + label + ' — ' + btn.textContent + '؟')) return;

  btn.disabled = true;
  try {
    await api('POST', { id, action, ...extra });
    show('✓ تم: ' + btn.textContent + ' لـ ' + label, 'ok');
    await load();
  } catch (e) {
    show('✗ فشل: ' + e.message, 'err');
  } finally {
    btn.disabled = false;
  }
}

async function load() {
  try {
    const data = await api('GET');
    stores = Array.isArray(data.items) ? data.items : [];
    renderStats();
    renderNumbers();
    renderList();
  } catch (e) {
    if (e.status === 401) {
      sessionStorage.removeItem('admin_pass');
      password = '';
      showLogin('كلمة السر غير صحيحة');
      return;
    }
    show('✗ تعذر التحميل: ' + e.message, 'err');
  }
}

function showLogin(msg) {
  $('app').classList.add('hidden');
  $('login-box').classList.remove('hidden');
  $('login-msg').textContent = msg || '';
}

function showApp() {
  $('login-box').classList.add('hidden');
  $('app').classList.remove('hidden');
}

$('btn-login').addEventListener('click', async () => {
  password = $('pass').value.trim();
  if (!password) return ($('login-msg').textContent = 'اكتب كلمة السر');
  sessionStorage.setItem('admin_pass', password);
  showApp();
  await load();
});

$('pass').addEventListener('keydown', e => {
  if (e.key === 'Enter') $('btn-login').click();
});

$('btn-refresh').addEventListener('click', load);

$('btn-logout').addEventListener('click', () => {
  sessionStorage.removeItem('admin_pass');
  password = '';
  showLogin('');
});

if (password) {
  showApp();
  load();
}
</script>
</body>
</html>
