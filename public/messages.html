<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>رسائل البوت</title>
<style>
body{font-family:system-ui,sans-serif;background:#f4f6fa;margin:0;color:#222}
.wrap{max-width:720px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:12px}
h1{font-size:18px;margin:0 0 4px}
.sub{font-size:13px;color:#666}
input[type=password]{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box;font-size:15px}
textarea{width:100%;min-height:110px;padding:10px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box;font-family:inherit;font-size:14px;resize:vertical}
select{padding:8px;border:1px solid #ccc;border-radius:8px;font-size:14px;margin-top:8px}
.btn{background:#1a73e8;color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:13px;font-weight:600;margin:8px 6px 0 0}
.btn.gray{background:#fff;color:#333;border:1px solid #ccc}
.btn.red{background:#fff;color:#d93025;border:1px solid #f1b3ad}
.btn:disabled{opacity:.5;cursor:wait}
.label{font-weight:700;font-size:15px;margin-bottom:4px}
.key{font-size:12px;color:#999;direction:ltr;text-align:right}
.changed{font-size:12px;color:#b06000;margin-top:4px}
.media{background:#f7f9fc;border:1px dashed #cdd6e4;border-radius:10px;padding:12px;margin-top:10px;font-size:13px}
.media .fname{direction:ltr;text-align:right;color:#444;margin:6px 0;word-break:break-all}
.hint{font-size:12px;color:#777;line-height:1.7}
#msg{font-size:13px;margin-top:8px;min-height:18px}
.ok{color:#188038}.err{color:#d93025}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">

  <div class="card" id="login-box">
    <h1>رسائل البوت</h1>
    <div class="sub" style="margin-bottom:12px">أدخل كلمة سر الإدارة للمتابعة</div>
    <input type="password" id="pass" placeholder="كلمة السر">
    <div style="margin-top:12px;text-align:left">
      <button class="btn" id="btn-login">دخول</button>
    </div>
    <div id="login-msg" class="err" style="margin-top:8px;font-size:13px"></div>
  </div>

  <div id="app" class="hidden">
    <div class="card">
      <h1>رسائل البوت</h1>
      <div class="sub">
        اختر نوع كل رسالة: نص أو صوت أو صورة أو فيديو، ثم عدّل النص أو ارفع الملف.<br>
        عند اختيار صوت يرسل البوت الملف الصوتي بدل النص، وعند اختيار صورة أو فيديو يصبح النص تعليقاً تحته.
      </div>
      <div id="msg"></div>
    </div>
    <div id="list"></div>
  </div>

</div>

<script>
let password = sessionStorage.getItem('admin_pass') || '';
let items = [];
const $ = id => document.getElementById(id);

const KIND_LABEL = { text: 'نص', audio: 'صوت', image: 'صورة', video: 'فيديو' };
const KIND_HINT = {
  audio: 'الصيغة المناسبة: OGG أو MP3. يُرسل كملاحظة صوتية بدون نص.',
  image: 'الصيغة المناسبة: JPG أو PNG. النص يظهر كتعليق تحت الصورة.',
  video: 'الصيغة المناسبة: MP4. النص يظهر كتعليق تحت الفيديو.',
};
const ACCEPT = { audio: 'audio/*', image: 'image/*', video: 'video/*' };
const LIMIT = 4 * 1024 * 1024;

function show(text, cls) {
  const m = $('msg');
  m.className = cls || '';
  m.textContent = text;
}

async function api(method, body) {
  const res = await fetch('/api/botmsg', {
    method,
    headers: { 'Content-Type': 'application/json', 'X-Admin-Password': password },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error(data.error || ('HTTP ' + res.status));
    err.status = res.status;
    throw err;
  }
  return data;
}

async function uploadFile(file, key, kind) {
  const ext = (file.name.split('.').pop() || 'bin').toLowerCase();
  const res = await fetch('/api/botmsg', {
    method: 'POST',
    headers: {
      'Content-Type': file.type || 'application/octet-stream',
      'X-Admin-Password': password,
      'X-Msg-Key': key,
      'X-Media-Kind': kind,
      'X-File-Ext': ext,
    },
    body: file,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
  return data;
}

function baseName(path) {
  return path ? String(path).split('/').pop() : '';
}

function render() {
  const box = $('list');
  box.innerHTML = '';

  items.forEach(it => {
    const card = document.createElement('div');
    card.className = 'card';

    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = it.label;

    const key = document.createElement('div');
    key.className = 'key';
    key.textContent = it.key;

    const kindSel = document.createElement('select');
    ['text', 'audio', 'image', 'video'].forEach(v => {
      const o = document.createElement('option');
      o.value = v;
      o.textContent = KIND_LABEL[v];
      kindSel.appendChild(o);
    });
    kindSel.value = it.kind || 'text';
    kindSel.addEventListener('change', () => changeKind(it, kindSel.value, kindSel));

    const ta = document.createElement('textarea');
    ta.value = it.value;

    const changed = document.createElement('div');
    changed.className = 'changed';
    const refresh = () => {
      changed.textContent = ta.value.trim() !== it.default_value.trim() ? 'معدّلة عن الأصل' : '';
    };
    ta.addEventListener('input', refresh);
    refresh();

    card.append(label, key, kindSel, ta, changed);

    const curKind = it.kind || 'text';
    if (curKind !== 'text') {
      const media = document.createElement('div');
      media.className = 'media';

      const hint = document.createElement('div');
      hint.className = 'hint';
      hint.textContent = KIND_HINT[curKind];

      const fname = document.createElement('div');
      fname.className = 'fname';
      fname.textContent = it.media_path ? 'الملف الحالي: ' + baseName(it.media_path) : 'لا يوجد ملف بعد';

      const fileInput = document.createElement('input');
      fileInput.type = 'file';
      fileInput.accept = ACCEPT[curKind];
      fileInput.className = 'hidden';
      fileInput.addEventListener('change', async () => {
        const file = fileInput.files[0];
        fileInput.value = '';
        if (!file) return;
        if (file.size > LIMIT) return show('✗ الملف أكبر من 4 ميغابايت', 'err');
        show('… جاري رفع الملف');
        try {
          await uploadFile(file, it.key, curKind);
          show('✓ تم رفع الملف: ' + it.label, 'ok');
          await load();
        } catch (e) {
          show('✗ فشل الرفع: ' + e.message, 'err');
        }
      });

      const upBtn = document.createElement('button');
      upBtn.className = 'btn';
      upBtn.textContent = it.media_path ? 'تغيير الملف' : 'رفع الملف';
      upBtn.addEventListener('click', () => fileInput.click());

      media.append(hint, fname, upBtn, fileInput);

      if (it.media_path) {
        const rm = document.createElement('button');
        rm.className = 'btn red';
        rm.textContent = 'حذف الملف';
        rm.addEventListener('click', async () => {
          if (!confirm('حذف الملف؟ سيعود البوت لإرسال النص.')) return;
          try {
            await api('POST', { key: it.key, remove_media: true });
            show('✓ تم حذف الملف', 'ok');
            await load();
          } catch (e) {
            show('✗ فشل الحذف: ' + e.message, 'err');
          }
        });
        media.appendChild(rm);
      }

      card.appendChild(media);
    }

    const save = document.createElement('button');
    save.className = 'btn';
    save.textContent = 'حفظ النص';
    save.addEventListener('click', async () => {
      save.disabled = true;
      try {
        await api('POST', { key: it.key, value: ta.value });
        it.value = ta.value.trim();
        show('✓ تم حفظ: ' + it.label, 'ok');
        refresh();
      } catch (e) {
        show('✗ فشل الحفظ: ' + e.message, 'err');
      } finally {
        save.disabled = false;
      }
    });

    const restore = document.createElement('button');
    restore.className = 'btn gray';
    restore.textContent = 'استعادة الأصل';
    restore.addEventListener('click', async () => {
      if (!confirm('استعادة النص الأصلي ونوع الرسالة نصاً؟ سيُحذف الملف المرفق.')) return;
      try {
        await api('POST', { key: it.key, restore: true });
        show('✓ تمت استعادة: ' + it.label, 'ok');
        await load();
      } catch (e) {
        show('✗ فشل الاستعادة: ' + e.message, 'err');
      }
    });

    card.append(save, restore);
    box.appendChild(card);
  });
}

async function changeKind(it, kind, sel) {
  try {
    await api('POST', { key: it.key, kind });
    show('✓ تم تغيير النوع إلى: ' + KIND_LABEL[kind], 'ok');
    await load();
  } catch (e) {
    show('✗ فشل التغيير: ' + e.message, 'err');
    sel.value = it.kind || 'text';
  }
}

async function load() {
  try {
    const data = await api('GET');
    items = Array.isArray(data.items) ? data.items : [];
    render();
  } catch (e) {
    if (e.status === 401) {
      sessionStorage.removeItem('admin_pass');
      password = '';
      $('app').classList.add('hidden');
      $('login-box').classList.remove('hidden');
      $('login-msg').textContent = 'كلمة السر غير صحيحة';
      return;
    }
    show('✗ تعذر التحميل: ' + e.message, 'err');
  }
}

$('btn-login').addEventListener('click', async () => {
  password = $('pass').value.trim();
  if (!password) return ($('login-msg').textContent = 'اكتب كلمة السر');
  sessionStorage.setItem('admin_pass', password);
  $('login-box').classList.add('hidden');
  $('app').classList.remove('hidden');
  await load();
});

$('pass').addEventListener('keydown', e => {
  if (e.key === 'Enter') $('btn-login').click();
});

if (password) {
  $('login-box').classList.add('hidden');
  $('app').classList.remove('hidden');
  load();
}
</script>
</body>
</html>
